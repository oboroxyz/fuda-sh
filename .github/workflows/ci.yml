name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select packages
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      json: ${{ steps.plan.outputs.json }}
      packages: ${{ steps.plan.outputs.packages }}
      subgraph: ${{ steps.plan.outputs.subgraph }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select changed packages and consumers
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 .github/scripts/ci.py plan "$BASE_SHA" > /tmp/ci-plan.json
          else
            python3 .github/scripts/ci.py plan > /tmp/ci-plan.json
          fi
          echo "json=$(cat /tmp/ci-plan.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/ci-plan.json >> "$GITHUB_STEP_SUMMARY"

  lockfile:
    name: Verify Actions lockfile
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

  zizmor:
    name: Audit Actions configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          online-audits: false

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  checks:
    name: Format, lint and type check
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          subgraph: ${{ needs.plan.outputs.subgraph }}
      - name: Format
        run: pnpm format:check
      - name: Lint and type check affected packages
        env:
          PLAN: ${{ needs.plan.outputs.json }}
        run: |
          printf '%s' "$PLAN" > /tmp/ci-plan.json
          python3 .github/scripts/ci.py check /tmp/ci-plan.json

  fallow:
    name: Audit changed code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Fail on findings this pull request introduces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec fallow audit --base "$BASE_SHA"

  packages:
    name: Test ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Test and build
        env:
          PACKAGE_PATH: ${{ matrix.package }}
        run: python3 .github/scripts/ci.py package "$PACKAGE_PATH"

  subgraph:
    name: Subgraph
    needs: plan
    if: needs.plan.outputs.subgraph == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          subgraph: 'true'
      - run: pnpm graph:prepare
      - run: pnpm graph:codegen
      - run: pnpm graph:build
      - name: Test manifest generation
        run: pnpm --ignore-workspace --dir packages/subgraphs/rights exec vitest run scripts
      - name: Install Matchstick runtime library
        run: sudo apt-get update && sudo apt-get install -y libpq5
      - run: pnpm graph:test --version 0.6.0

  ci:
    name: CI
    if: always()
    needs: [plan, lockfile, zizmor, dependency-review, checks, fallow, packages, subgraph]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          assert results['checks']['result'] == 'success', results
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PY
