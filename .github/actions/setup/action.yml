name: Setup workspace
description: Install the pinned pnpm and Node toolchain with a frozen lockfile.
inputs:
  subgraph:
    description: Also install independent Subgraph dependencies for its scripts and type configuration.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          packages/subgraphs/rights/pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.subgraph == 'true'
      shell: bash
      run: pnpm --ignore-workspace --dir packages/subgraphs/rights install --frozen-lockfile --config.minimumReleaseAge=4320
