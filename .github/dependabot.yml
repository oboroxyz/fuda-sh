version: 2
# Dependabot supports pnpm 11 as of 2026-10-20. The independent Subgraph and
# Substreams crates stay manual to preserve The Graph compatibility.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Major updates stay in separate pull requests, so a failure names its package.
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    # These packages must be upgraded together with the workspace overrides.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: '@voidzero-dev/*'
      - dependency-name: oxlint
      - dependency-name: oxfmt
      - dependency-name: vitest
      - dependency-name: ultracite
      # Types follow the Node major that package.json provisions.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
