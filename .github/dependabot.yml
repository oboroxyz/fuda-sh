version: 2
# npm updates remain manual until Dependabot supports pnpm 11. Cargo updates for
# the Substreams crates also remain manual to preserve The Graph compatibility.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
