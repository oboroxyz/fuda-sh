syntax = "proto3";

package fuda.pipeline.v1;

import "erc5564.proto";

enum EasEventKind {
  EAS_EVENT_KIND_UNSPECIFIED = 0;
  EAS_EVENT_KIND_ATTESTED = 1;
  EAS_EVENT_KIND_REVOKED = 2;
}

message EasEvent {
  EasEventKind kind = 1;
  bytes uid = 2;
  bytes attester = 3;
  bytes recipient = 4;
  bytes schema_uid = 5;
  bytes tx_hash = 6;
  uint32 log_index = 7;
  uint64 block_number = 8;
  uint64 timestamp = 9;
}

message EasEvents {
  repeated EasEvent items = 1;
}

message FudaEvents {
  repeated fuda.erc5564.v1.Announcement announcements = 1;
  repeated EasEvent eas_events = 2;
}
