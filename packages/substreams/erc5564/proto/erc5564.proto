syntax = "proto3";

package fuda.erc5564.v1;

message Announcement {
  bytes scheme_id = 1;
  bytes stealth_address = 2;
  bytes caller = 3;
  bytes ephemeral_pub_key = 4;
  bytes metadata = 5;
  bytes tx_hash = 6;
  uint32 log_index = 7;
  uint64 block_number = 8;
  uint64 timestamp = 9;
}

message Announcements {
  repeated Announcement items = 1;
}
