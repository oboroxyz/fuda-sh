[package]
name = "erc5564-eas-pipeline-substreams"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ethabi = "17.2.0"
prost = "0.13.3"
substreams = "0.7.6"
substreams-ethereum = "0.11.1"

[build-dependencies]
prost-build = "0.13.3"
substreams-ethereum = "0.11.1"

[dev-dependencies]
prost-types = "0.14.4"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2.17", features = ["custom"] }

[profile.release]
lto = true
opt-level = "z"
strip = "debuginfo"
