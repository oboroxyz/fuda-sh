packages:
  - apps/*
  - packages/*
# pnpm 11 reads settings from this file, not .npmrc.
engineStrict: true
autoInstallPeers: false
# Node is provisioned by pnpm itself via package.json devEngines.runtime
# (onFail: download); no .node-version / version manager needed.
allowBuilds:
  # Void's local DB commands open the same D1 SQLite file as the dev server.
  better-sqlite3: true
  esbuild: true
  workerd: true
# vite-plus pins oxlint/oxfmt exactly; ultracite floats. Without these overrides
# two oxlint copies get installed and the ultracite presets' OxlintConfig type
# no longer matches vite-plus's defineConfig (TS2769 in vite.config.ts).
#
# vite-plus-core is a fork of vite: a third-party Vite plugin (e.g.
# @tailwindcss/vite) that declares a `vite` peer otherwise resolves the real
# `vite` package, splitting the graph into two structurally similar but
# nominally distinct `Plugin`/`UserConfig` types (TS2321/TS2769 in
# vite.config.ts). Redirecting the peer to the same vite-plus-core release
# unifies the types (see vite-plus docs/guide/migrate-rules.md "Vite and
# Overrides").
overrides:
  oxlint: '=1.91.0'
  oxfmt: '=0.76.0'
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - cn@0.2.6
  - miniflare@5.20260908.0-alpha || 5.20260910.0-alpha || 5.20260925.0-alpha || 5.20261101.0-beta
  - wrangler@4.130.0 || 4.131.0 || 4.141.0
  - workerd@1.20260910.1 || 1.20260925.1 || 1.20261101.1
  - '@cloudflare/workerd-darwin-64@1.20260910.1 || 1.20260925.1 || 1.20261101.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260910.1 || 1.20260925.1 || 1.20261101.1'
  - '@cloudflare/workerd-linux-64@1.20260910.1 || 1.20260925.1 || 1.20261101.1'
  - '@cloudflare/workerd-linux-arm64@1.20260910.1 || 1.20260925.1 || 1.20261101.1'
  - '@cloudflare/workerd-windows-64@1.20260910.1 || 1.20260925.1 || 1.20261101.1'
  # Void 1.7.0 (2026-11-09) and the fresh releases it requires, adopted before the age window passed.
  - '@void/deploy-cloudflare@1.7.0'
  - '@void/deploy-core@1.7.0'
  - '@void/edge@1.7.0'
  - '@void/isr@1.7.0'
  - '@void/platform@1.7.0'
  - void@1.7.0
  # The Preact adapter for Void, published 2026-11-09 and pinned exactly.
  - void-preact@0.1.3
  - '@cloudflare/build-output-utils@0.9.7'
  - '@cloudflare/codemods@0.7.1'
  - '@cloudflare/config@0.29.1'
  - '@cloudflare/runtime-types@0.1.20'
  - '@cloudflare/vite-plugin@2.0.0-beta.v.9'
  - '@cloudflare/workers-auth@0.15.4'
  - '@cloudflare/workers-types@5.20261102.1'
  - '@cloudflare/workers-utils@0.50.2'
  - hono@4.13.16
  # Fresh releases Void 1.7.0 requires, adopted before the age window passed.
  - hono@4.13.17
  - '@cloudflare/workers-types@5.20261109.1'
  # @cloudflare/vitest-plugin (the renamed vitest-pool-workers) 1.6.0, the first with
  # Vitest 5 support we adopt, and the fresh releases it pins exactly.
  - '@cloudflare/vitest-plugin@1.6.0'
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
